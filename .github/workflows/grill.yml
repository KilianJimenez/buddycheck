name: SDD - Grill

# Reusable SDD command: `!grill` runs a grilling pass on an idea/spec issue —
# posting clarifying questions, sharpened scope, and surfaced assumptions as a
# comment.
#
# This workflow is `workflow_call`-only. It is never triggered directly by a
# comment; the sole `issue_comment` entrypoint for all SDD commands is
# `sdd-conductor.yml`, which enforces the exact-author + `startsWith` guard
# and invokes this workflow via `uses:` (see .buddy/docs/sdd-workflow.md).
#
# Required secrets (passed by the caller):
#   - COPILOT_CLI_TOKEN: a GitHub Copilot CLI auth token (personal access
#     token or Copilot token) used to authenticate `copilot` non-interactively.
#   - GH_PAT: a classic Personal Access Token with `repo` + `workflow` scopes,
#     used for `gh`/GraphQL operations that the default GITHUB_TOKEN can't
#     perform (see buddy-once.yml).
on:
  workflow_call:
    inputs:
      issue_number:
        description: The number of the issue to run the grill-my-idea agent on.
        required: true
        type: number
    secrets:
      COPILOT_CLI_TOKEN:
        required: true
      GH_PAT:
        required: true

permissions:
  issues: write
  contents: read

jobs:
  grill:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run grill-my-idea agent
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          copilot \
            --agent=grill-my-idea \
            --allow-all-tools \
            -p "Read issue #${ISSUE_NUMBER} and its full comment thread. Post one round of relentless, focused clarifying questions, sharpened scope, and surfaced open assumptions as a single comment on issue #${ISSUE_NUMBER} to shape the idea toward an implementable design, and set the sdd:grilling label on issue #${ISSUE_NUMBER} (removing any other sdd:* label)."
