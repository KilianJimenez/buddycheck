name: SDD - Grill

# Comment-triggered SDD command: `!grill` runs a grilling pass on an idea/spec
# issue — posting clarifying questions, sharpened scope, and surfaced
# assumptions as a comment.
#
# Trigger guard: the comment author must be exactly `KilianJimenez` and the
# comment body must start with `!grill` (see .buddy/docs/sdd-workflow.md).
#
# Required repository secrets:
#   - COPILOT_CLI_TOKEN: a GitHub Copilot CLI auth token (personal access
#     token or Copilot token) used to authenticate `copilot` non-interactively.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  grill:
    if: |
      github.event.comment.user.login == 'KilianJimenez' &&
      startsWith(github.event.comment.body, '!grill')
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run grill-my-idea agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          copilot \
            --agent=grill-my-idea \
            --allow-all-tools \
            -p "Read issue #${ISSUE_NUMBER} and its full comment thread. Post one round of relentless, focused clarifying questions, sharpened scope, and surfaced open assumptions as a single comment on issue #${ISSUE_NUMBER} to shape the idea toward an implementable design, and set the sdd:grilling label on issue #${ISSUE_NUMBER} (removing any other sdd:* label)."
