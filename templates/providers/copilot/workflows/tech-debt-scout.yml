name: Tech Debt Scout

# Weekly + manual scout: scans the whole repo (source, ADRs, CONTEXT.md,
# READMEs), picks the single most important critical/high-severity tech-debt
# item (architectural > code > documentation > devops > process > security
# tie-break order), and files it as a `needs-triage` + `tech-debt:<type>`
# issue — skipping duplicates and reporting "No major issues found at the
# moment." when nothing qualifies.
#
# Required repository secrets:
#   - COPILOT_CLI_TOKEN: a GitHub Copilot CLI auth token (personal access
#     token or Copilot token) used to authenticate `copilot` non-interactively.
on:
  schedule:
    - cron: '0 19 * * 5'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  tech-debt-scout:
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run tech-debt-scout agent
        run: |
          copilot \
            --agent=tech-debt-scout \
            --allow-all-tools \
            -p "Scan the whole repository (source, docs/adr/, CONTEXT.md, READMEs). Consider only critical or high severity technical debt across architectural, code, documentation, DevOps, process, and security types, using that order as the tie-break. Check currently open issues carrying any tech-debt:* label and skip filing if the chosen debt is already tracked. If a qualifying, untracked candidate is found, file exactly one GitHub issue labelled needs-triage plus the single matching tech-debt:<type> label (no sdd:* label, not ready-for-agent). If nothing qualifies or the only candidate is already tracked, print 'No major issues found at the moment.' and exit successfully."
