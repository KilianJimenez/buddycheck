name: SDD - To Issues

# Comment-triggered SDD command: `!to-issues` turns an approved plan (posted
# by the `!to-plan` step) into real, linked GitHub issues.
#
# Trigger guard: the comment author must be exactly `{{OWNER}}` and the
# comment body must start with `!to-issues` (see .buddy/docs/sdd-workflow.md).
#
# Required repository secrets:
#   - ANTHROPIC_API_KEY: an Anthropic API key used to authenticate the
#     `opencode` CLI non-interactively.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  to-issues:
    if: |
      github.event.comment.user.login == '{{OWNER}}' &&
      startsWith(github.event.comment.body, '!to-issues')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Opencode CLI
        run: npm install -g opencode-ai

      - name: Run spec-to-issues agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          opencode run \
            --agent spec-to-issues \
            "Read issue #${ISSUE_NUMBER} and its full comment thread. Find the most recent !to-plan comment's approved plan and suggested vertical-slice issues, create the corresponding real issues on the tracker (each linked back with 'Part of #${ISSUE_NUMBER}' and labeled ready-for-agent), post a single summary comment on issue #${ISSUE_NUMBER} listing the created issues with links, and set the sdd:issues-created label on issue #${ISSUE_NUMBER}."
