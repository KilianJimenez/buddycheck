name: SDD - Grill

# Comment-triggered SDD command: `!grill` runs a grilling pass on an idea/spec
# issue — posting clarifying questions, sharpened scope, and surfaced
# assumptions as a comment.
#
# Trigger guard: the comment author must be exactly `{{OWNER}}` and the
# comment body must start with `!grill` (see .buddy/docs/sdd-workflow.md).
#
# Required repository secrets:
#   - ANTHROPIC_API_KEY: an Anthropic API key used to authenticate the
#     `opencode` CLI non-interactively.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  grill:
    if: |
      github.event.comment.user.login == '{{OWNER}}' &&
      startsWith(github.event.comment.body, '!grill')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Opencode CLI
        run: npm install -g opencode-ai

      - name: Run grill-my-idea agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          opencode run \
            --agent grill-my-idea \
            "Read issue #${ISSUE_NUMBER} and its full comment thread. Post one round of relentless, focused clarifying questions, sharpened scope, and surfaced open assumptions as a single comment on issue #${ISSUE_NUMBER} to shape the idea toward an implementable design, and set the sdd:grilling label on issue #${ISSUE_NUMBER} (removing any other sdd:* label)."
